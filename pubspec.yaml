name: blue_sky
description: "BLUE-SKY — Gestion Restaurant-Hôtel (desktop)"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Base de données locale (SQLite type-safe + réactive) ---
  drift: ^2.20.0
  # sqlite3_flutter_libs a été supprimé : à partir de sqlite3 3.x, le
  # bundling du moteur SQLite passe par les build hooks Dart (voir
  # https://pub.dev/packages/sqlite3/changelog).
  sqlite3: ^3.5.1
  path_provider: ^2.1.4           # trouve le dossier "Documents" de l'utilisateur
  path: ^1.9.0

  # --- Auto-update (verif version distante + hash) ---
  crypto: ^3.0.0                  # SHA-256 verification de l'installeur
  pub_semver: ^2.1.0              # comparaison de versions semver

  # --- État de l'application ---
  flutter_riverpod: ^2.5.1

  # --- Navigation (utile dès qu'on aura plusieurs écrans) ---
  go_router: ^14.2.0

  # --- Graphes du futur dashboard ---
  fl_chart: ^0.69.0

  # --- Formatage nombres / monnaie / dates ---
  intl: ^0.19.0

  # --- Typographie (Fraunces / Inter / JetBrains Mono) ---
  google_fonts: ^6.2.1

  # --- Génération et impression PDF (factures + rapports) ---
  pdf: ^3.11.1
  printing: ^5.13.2

  # --- Sécurité (hash mots de passe) ---
  bcrypt: ^1.1.3

  # --- Boîtes de dialogue fichiers (export BDD) ---
  file_selector: ^1.0.3

  # --- Génération Excel ---
  excel: ^4.0.6

  # --- Stockage cloud (backup BDD + photos produits) ---
  supabase_flutter: ^2.5.6
  connectivity_plus: ^6.0.5
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Génération du code Drift (obligatoire, voir README)
  drift_dev: ^2.20.0
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  # Génération de l'icône de l'app (barre des tâches / fenêtre)
  flutter_launcher_icons: ^0.14.1

# Icône de l'application, générée depuis le logo Skyblue.
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
